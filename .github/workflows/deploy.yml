name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test tests/*.test.mjs
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Deploy Worker
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log || {
            # Surface the error as annotations (readable from the API without log access).
            grep -v '^\s*$' deploy.log | tail -n 15 | sed 's/^/::error title=wrangler deploy::/'
            exit 1
          }
      - name: Build player index
        run: node scripts/build-players.mjs players.json
      - name: Upload player index to KV
        run: |
          set -o pipefail
          npx wrangler kv key put players --path players.json --binding CACHE --remote 2>&1 | tee kv.log || {
            grep -v '^\s*$' kv.log | tail -n 15 | sed 's/^/::error title=kv put::/'
            exit 1
          }
