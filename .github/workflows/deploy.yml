name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test tests/*.test.mjs
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Build player index
        run: node scripts/build-players.mjs players.json
      - name: Upload player index to KV
        run: npx wrangler kv key put players --path players.json --binding CACHE --remote
